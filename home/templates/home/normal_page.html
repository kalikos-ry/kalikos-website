{% extends "base.html" %}

{% load wagtailcore_tags wagtailimages_tags %}

{% block content %}
{% image page.title_image original as title_image %}
<div class="page-title" style="background-image: url({{ title_image.url }})">
    <div class="container">
        <div class="row">
            <div class="col-sm-6">
                <h1>{{ page.title }}</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb">
                    <li>
                        <a href="/"><i class="ion-ios-home"></i></a>
                    </li>
                </ol>
            </div>
        </div>
    </div>
</div>
<div class="divided-70"></div>
{% block page_content %}
<div class="container normal-content">
    <div class="row">
        <div class="col-sm-12">
            {{ page.body }}
        </div>
    </div>
</div>

{% endblock %}
{% endblock %}
