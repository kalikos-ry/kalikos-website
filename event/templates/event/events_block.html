{% load wagtailcore_tags wagtailimages_tags %}

{% if events %}
<div class="upcoming-events">
    <div class="container">
        <div class="row">
            
            {% for event in events %}
            <div class="col-sm-6 col-md-4">
                {% include "event/incl_eventbox.html" %}
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="clearfix"></div>
</div>
<div class="divided-30"></div>
{% else %}
<p>{{ no_events }}</p>
{% endif %}
