{% extends "home/normal_page.html" %}

{% load wagtailcore_tags %}
{% load kalikos_image_tags %}

{% block title_image %}
{% image page.title_image original as title_image %}
<div class="page-title" style="background-image: url({{ title_image.url }})">
{% endblock %}

{% block page_content %}
<div class="container">
    <div class="row">
        <div class="col-sm-12">
            {% include_block page.body %}
        </div>
    </div>
</div>

{% endblock %}
