{% load menu_tags %}
{% if menu_items %}
	<div class="dropdown-menu" aria-labelledby="ddtoggle_{{ parent_page.pk }}">
    <a href="{{ item.href }}" class="dropdown-item">{{ item.text }}</a>
	{% for item in menu_items %}
        <a href="{{ item.href }}" class="ml-2 dropdown-item {% if item.has_children_in_menu %}dropdown-toggle" id="ddtoggle_{{ item.pk }}" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false{% endif %}">{{ item.text }}{% if item.has_children_in_menu %} <span class="caret"></span>{% endif %}</a>
        {% if item.has_children_in_menu %}
            {% sub_menu item template=current_template %}
        {% endif %}
	{% endfor %}
	</div>
{% endif %}
