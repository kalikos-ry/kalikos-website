{% load menu_tags %}
<ul class="nav navbar-nav navbar-right">
{% for item in menu_items %}
    <li class="{{ item.active_class }}{% if item.has_children_in_menu %} dropdown{% endif %}">
        <a href="{{ item.href }}">
            {{ item.text }}
        {% if item.has_children_in_menu %}
        <a href="#" class="dropdown-toggle dropdown-toggle-split" id="ddtoggle_{{ item.link_page.pk }}" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><span class="caret"></span></a>
        {% endif %}
        </a>
        {% if item.has_children_in_menu %}
        	{% sub_menu item template="menus/bootstrap3/sub_menu_dropdown.html" %}
        {% endif %}
    </li>       
{% endfor %}
</ul>
